[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redshift-intelligence"
version = "0.1.0"
description = "Production-oriented multi-agent diagnostic copilot for Amazon Redshift"
requires-python = ">=3.12,<3.15"
dependencies = [
  "arize-phoenix-otel>=0.13,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain-core==1.6.0",
  "langchain-groq==1.1.3",
  "langchain-huggingface==1.2.2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-redis==0.5.2",
  "opentelemetry-api>=1.36,<2",
  "openinference-instrumentation-langchain>=0.1.50,<1",
  "pinecone[asyncio]==7.3.0",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "rank-bm25>=0.2.2,<1",
  "redis==6.4.0",
  "sentence-transformers==5.6.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "fakeredis>=2.28,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
